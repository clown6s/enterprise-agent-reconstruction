# Prometheus 抓取配置
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: enterprise-agent
    metrics_path: /metrics
    static_configs:
      - targets: ["enterprise-agent:8000"]

  - job_name: otel-collector
    metrics_path: /metrics
    static_configs:
      - targets: ["otel-collector:8889"]
